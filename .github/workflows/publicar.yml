name: Compilar e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar Windows x64
        run: dotnet publish DisneyExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo
      - name: Montar pacote Windows
        shell: pwsh
        run: |
          if (!(Test-Path dist/DisneyExplode.exe)) { throw 'Executável ausente' }
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Copy-Item LICENSE dist/LICENSE
          Compress-Archive -Path dist/DisneyExplode.exe, dist/LEIA-ME.txt, dist/LICENSE -DestinationPath DisneyExplode-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/DisneyExplode.exe
            DisneyExplode-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar empacotador
        run: python -m pip install pyinstaller==6.16.0
      - name: Verificar diagnóstico Linux
        run: |
          python linux/disney_explode.py --json --output /tmp/disney-report.json
          python -c "import json; r=json.load(open('/tmp/disney-report.json')); assert r['system']['os']=='Linux'; assert r['cpu']['logical_cores']>0; assert r['memory_bytes']['MemTotal']>0; assert r['disks']"
      - name: Compilar binário Linux x64
        run: python -m PyInstaller --onefile --name DisneyExplode-linux-x64 --distpath dist --workpath build/linux --specpath build linux/disney_explode.py
      - name: Verificar e empacotar binário Linux
        run: |
          ./dist/DisneyExplode-linux-x64 --json --output /tmp/disney-binary-report.json
          python -c "import json; r=json.load(open('/tmp/disney-binary-report.json')); assert r['app']=='Disney Explode Linux'; assert r['memory_bytes']['MemTotal']>0"
          cp linux/README.md dist/README-linux.md
          cp LICENSE dist/LICENSE
          tar -czf DisneyExplode-linux-x64.tar.gz -C dist DisneyExplode-linux-x64 README-linux.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: DisneyExplode-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publicar downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then tag=latest; fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Disney Explode ($tag)" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$tag" packages/DisneyExplode.exe packages/DisneyExplode-windows-x64.zip packages/DisneyExplode-linux-x64.tar.gz --clobber
