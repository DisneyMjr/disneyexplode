name: Publicar

# A cada push na main, gera o DisneyExplode.exe e atualiza a release "latest" (sempre a versão mais nova).
# Ao criar uma tag (ex.: v0.12), gera também uma release fixa dessa versão.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publicar (arquivo único, com o .NET embutido)
        run: dotnet publish DisneyExplode.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist -nologo

      - name: Montar pacote
        shell: pwsh
        run: |
          Copy-Item LEIA-ME.txt dist/LEIA-ME.txt
          Compress-Archive -Path dist/DisneyExplode.exe, dist/LEIA-ME.txt -DestinationPath DisneyExplode.zip

      - name: Salvar executável como artefato
        uses: actions/upload-artifact@v4
        with:
          name: DisneyExplode-windows-x64
          path: |
            dist/DisneyExplode.exe
            DisneyExplode.zip

      - name: Atualizar release "latest"
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete latest --cleanup-tag --yes; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          gh release create latest DisneyExplode.zip dist/DisneyExplode.exe --target $env:GITHUB_SHA --latest --title "Disney Explode (versão mais recente)" --notes-file NOVIDADES.md

      - name: Release da versão (tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME DisneyExplode.zip dist/DisneyExplode.exe --title "Disney Explode $env:GITHUB_REF_NAME" --generate-notes --latest=false
